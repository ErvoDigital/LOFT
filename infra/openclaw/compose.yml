services:
  openclaw:
    # Official image pinned to the digest inspected on 2026-10-04.
    image: ghcr.io/openclaw/openclaw@sha256:d0ded1dd76939b2bf4d67ef2d13247b8b160aa5666331d4a0b0e58811182cbb8
    init: true
    restart: unless-stopped
    command: ["node", "/etc/loft/start.mjs"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Add OPENROUTER_API_KEY to server/.env first}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Run npm run ai:setup first}
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - ./openclaw.json:/etc/loft/openclaw.json:ro
      - ./start.mjs:/etc/loft/start.mjs:ro
      - loft-openclaw-state:/home/node/.openclaw
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  loft-openclaw-state:
